name: Repository Governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Repository Governance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify version-controlled governance controls
        run: |
          set -euo pipefail
          test -s .github/CODEOWNERS
          test -s .github/branch-protection.main.json
          jq -e '
            .required_pull_request_reviews.required_approving_review_count >= 2 and
            .required_pull_request_reviews.require_code_owner_reviews == true and
            .required_pull_request_reviews.require_last_push_approval == true and
            .enforce_admins == true and
            .required_linear_history == true and
            .required_conversation_resolution == true and
            .allow_force_pushes == false and
            .allow_deletions == false
          ' .github/branch-protection.main.json
